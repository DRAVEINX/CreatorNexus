name: Windows CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Restore
        run: dotnet restore CreatorNexus.sln
      - name: Test shared core
        run: dotnet test tests/CreatorNexus.Core.Tests/CreatorNexus.Core.Tests.csproj --configuration Release
      - name: Build Windows
        run: dotnet build src/CreatorNexus.App/CreatorNexus.App.csproj -f net10.0-windows10.0.19041.0 --configuration Release
